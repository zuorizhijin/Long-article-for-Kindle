<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kindle Article Sync</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-title">Kindle Article Sync</span>
      </div>
      <div class="topbar-right">
        <button id="healthBadge" class="health-badge checking" title="点击刷新服务状态">
          <span class="dot"></span>
          <span id="healthText">检测中...</span>
        </button>
        <button id="toggleSettingsBtn" class="icon-btn" title="服务地址设置">⚙</button>
      </div>
    </header>

    <section id="settingsPanel" class="settings-panel hidden">
      <label class="field-label" for="serverUrlInput">PC 同步服务地址</label>
      <div class="row">
        <input id="serverUrlInput" type="url" placeholder="http://127.0.0.1:8765" />
        <button id="saveServerBtn" class="btn btn-small">保存并检测</button>
      </div>
    </section>

    <nav class="tabs">
      <button id="tabBtnWeb" class="tab-btn active" data-tab="web">网页 / X 文章</button>
      <button id="tabBtnObsidian" class="tab-btn" data-tab="obsidian">Obsidian MD</button>
      <button id="tabBtnConvert" class="tab-btn" data-tab="convert">格式转换</button>
    </nav>

    <!-- Tab 1: Web / X Articles -->
    <main id="panelWeb" class="panel">
      <div class="info-row">
        <span id="pageModeBadge" class="mode-badge">检测页面中...</span>
        <button id="reExtractBtn" class="link-btn">重新抓取</button>
      </div>

      <div id="webErrorBox" class="alert alert-error hidden"></div>

      <div id="webPreviewBox" class="card hidden">
        <label class="field-label" for="webTitleInput">文章标题</label>
        <input id="webTitleInput" type="text" />
        <div class="meta-line">
          <span>作者：<strong id="webAuthorText">-</strong></span>
          <span>图片：<strong id="webImgCount">0</strong> 张</span>
        </div>
        <div id="webSnippet" class="snippet"></div>
      </div>

      <div class="folder-box">
        <div class="folder-status">
          <span id="webFolderText">保存位置：文章 / 根目录</span>
        </div>
        <div class="folder-row">
          <button id="webPickFolderBtn" class="btn btn-small" type="button">选择 / 新建分类文件夹</button>
          <select id="webFolderSelect" class="folder-select" title="快速切换已有分类">
            <option value="">根目录</option>
          </select>
          <button id="webFolderRootBtn" class="btn btn-small" type="button" title="重置为根目录">根目录</button>
        </div>
      </div>

      <div class="actions">
        <button id="webSendBtn" class="btn btn-primary" disabled>生成 EPUB 并发送到电脑</button>
        <button id="webDownloadBtn" class="btn btn-secondary" disabled>下载 EPUB</button>
      </div>
    </main>

    <!-- Tab 2: Local Obsidian Markdown -->
    <main id="panelObsidian" class="panel hidden">
      <div class="vault-bar">
        <div class="vault-status">
          <span id="vaultNameText">未授权文件夹（点击右侧选择你的 Obsidian 知识库目录）</span>
        </div>
        <div class="vault-btns">
          <button id="pickVaultBtn" class="btn btn-small">选择文件夹</button>
          <button id="grantVaultBtn" class="btn btn-small btn-warn hidden">恢复权限</button>
          <button id="openTabBtn" class="link-btn" title="如弹窗在系统选择框打开时自动关闭，请点此在标签页中操作">独立标签页</button>
        </div>
      </div>

      <div id="obsidianSearchWrap" class="hidden">
        <input id="mdSearchInput" type="search" placeholder="搜索 .md 笔记文件名或路径..." />
        <div class="batch-bar">
          <div class="batch-left">
            <button id="mdToggleAllBtn" class="btn btn-small" type="button">全选</button>
            <span id="mdCheckedCount" class="muted-small">已选 0 篇</span>
          </div>
          <button id="mdBatchSendBtn" class="btn btn-small btn-batch" type="button" disabled>批量同步 (0)</button>
        </div>
        <div id="mdFileCount" class="muted-small"></div>
        <ul id="mdFileList" class="file-list"></ul>
      </div>

      <div id="mdSelectedBox" class="card hidden">
        <label class="field-label" for="mdTitleInput">EPUB 标题</label>
        <input id="mdTitleInput" type="text" />
        <div class="meta-line">
          <span>文件：<strong id="mdSelectedPath">-</strong></span>
        </div>
      </div>

      <div class="folder-box">
        <div class="folder-status">
          <span id="mdFolderText">保存位置：文章 / 根目录</span>
        </div>
        <div class="folder-row">
          <button id="mdPickFolderBtn" class="btn btn-small" type="button">选择 / 新建分类文件夹</button>
          <select id="mdFolderSelect" class="folder-select" title="快速切换已有分类">
            <option value="">根目录</option>
          </select>
          <button id="mdFolderRootBtn" class="btn btn-small" type="button" title="重置为根目录">根目录</button>
        </div>
      </div>

      <div class="actions">
        <button id="mdSendBtn" class="btn btn-primary" disabled>转换并发送到电脑</button>
        <button id="mdDownloadBtn" class="btn btn-secondary" disabled>下载 EPUB</button>
      </div>
    </main>

    <!-- Tab 3: Format Convert & Upload -->
    <main id="panelConvert" class="panel hidden">
      <div id="calibreWarnBox" class="alert alert-warn hidden">
        电脑端未检测到 Calibre，仅支持直接上传 EPUB（以及存入电子书的 PDF）。
      </div>

      <div id="convertDropZone" class="drop-zone" tabindex="0">
        <input
          id="convertFileInput"
          type="file"
          multiple
          accept=".mobi,.azw3,.azw,.prc,.epub,.txt,.html,.htm,.docx,.doc,.rtf,.fb2,.chm,.odt,.pdf"
          class="hidden"
        />
        <div class="drop-zone-title">点击选择或拖拽电子书/文档到此处</div>
        <div class="drop-zone-sub">支持 MOBI / AZW3 / EPUB / PDF / DOCX / TXT / HTML 等</div>
      </div>

      <div id="convertListWrap" class="hidden">
        <div class="convert-list-header">
          <span id="convertCountText" class="muted-small">已选 0 个文件</span>
          <button id="convertClearBtn" class="link-btn" type="button">清空列表</button>
        </div>
        <ul id="convertFileList" class="file-list convert-file-list"></ul>
      </div>

      <div class="target-box">
        <span class="field-label">同步目标</span>
        <div class="target-radios">
          <label class="radio-label">
            <input type="radio" name="convertTarget" value="inbox" checked />
            <span>文章（inbox）</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="convertTarget" value="books" />
            <span>电子书（books）</span>
          </label>
        </div>
      </div>

      <div id="convertFolderBox" class="folder-box">
        <div class="folder-status">
          <span id="convertFolderText">保存位置：文章 / 根目录</span>
        </div>
        <div class="folder-row">
          <button id="convertPickFolderBtn" class="btn btn-small" type="button">选择 / 新建分类文件夹</button>
          <select id="convertFolderSelect" class="folder-select" title="快速切换已有分类">
            <option value="">根目录</option>
          </select>
          <button id="convertFolderRootBtn" class="btn btn-small" type="button" title="重置为根目录">根目录</button>
        </div>
      </div>

      <div class="actions">
        <button id="convertSendBtn" class="btn btn-primary" disabled>转换并同步到电脑 (0)</button>
      </div>
    </main>

    <footer id="statusBar" class="status-bar hidden"></footer>
  </div>

  <script src="lib/idb_store.js"></script>
  <script src="lib/epub_builder.js"></script>
  <script src="lib/markdown.js"></script>
  <script src="popup.js"></script>
</body>
</html>
